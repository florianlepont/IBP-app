name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      mobile: ${{ steps.filter.outputs.mobile }}
      shared: ${{ steps.filter.outputs.shared }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
            mobile:
              - 'mobile/**'
            shared:
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
              - '.eslintrc.json'
              - '.prettierrc.json'
              - '.prettierignore'
              - 'tsconfig*.json'
              - 'scripts/**'
            image:
              - 'api/**'
              - 'package.json'
              - 'package-lock.json'
              - '.dockerignore'

  check:
    name: Lint, format, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: modules
        with:
          path: |
            node_modules
            api/node_modules
            mobile/node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Download actionlint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint

      - name: Run actionlint
        run: '"$RUNNER_TEMP/actionlint" .github/workflows/*.yml'

  unit-api:
    name: Unit tests — API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.shared == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: modules
        with:
          path: |
            node_modules
            api/node_modules
            mobile/node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage
        working-directory: api

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-api
          path: api/coverage/unit/lcov.info
          retention-days: 14

  unit-mobile:
    name: Unit tests — Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.shared == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: modules
        with:
          path: |
            node_modules
            api/node_modules
            mobile/node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage
        working-directory: mobile

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-mobile
          path: mobile/coverage/unit/lcov.info
          retention-days: 14

  e2e:
    name: E2E tests — API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.shared == 'true'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ibp_test
          POSTGRES_USER: ibp
          POSTGRES_PASSWORD: ibp
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      NODE_ENV: test
      PORT: 3000
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: ibp_test
      POSTGRES_USER: ibp
      POSTGRES_PASSWORD: ibp
      PGPASSWORD: ibp
      OBJECT_STORAGE_MODE: local
      OBJECT_STORAGE_BUCKET: ibp-media
      ATTACHMENTS_UPLOAD_DIR: /tmp/ibp-uploads
      SMTP_ENABLED: false
      DEBUG_DATA_RESET_ENABLED: true
      CADASTRE_PROVIDER: synthetic
      CADASTRE_PROVIDER_ALLOW_FALLBACK: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: modules
        with:
          path: |
            node_modules
            api/node_modules
            mobile/node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: E2E run 1
        run: npm run test:e2e

      - name: Plant reset sentinel
        run: psql -h localhost -U ibp -d ibp_test -c "CREATE TABLE e2e_reset_sentinel (id int)"

      - name: E2E run 2 (same database)
        run: npm run test:e2e

      - name: Assert the database was reset
        run: |
          result=$(psql -h localhost -U ibp -d ibp_test -tAc "SELECT to_regclass('public.e2e_reset_sentinel') IS NULL")
          echo "sentinel gone: $result"
          if [ "$result" != "t" ]; then
            echo "E2E globalSetup did not reset the database between runs" >&2
            exit 1
          fi

  # Same suite as `e2e`, against a real MinIO: presigned PUT Content-Length
  # enforcement, the 422 size path and the profile-picture round trip only run
  # here (itMinio). Separate job so neither approaches its timeout. The bucket
  # is not pre-created: StorageService creates it lazily, and this job proves it.
  e2e-minio:
    name: E2E tests — API (MinIO mode)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.shared == 'true'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ibp_test
          POSTGRES_USER: ibp
          POSTGRES_PASSWORD: ibp
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      NODE_ENV: test
      PORT: 3000
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: ibp_test
      POSTGRES_USER: ibp
      POSTGRES_PASSWORD: ibp
      PGPASSWORD: ibp
      OBJECT_STORAGE_MODE: minio
      OBJECT_STORAGE_BUCKET: ibp-media
      OBJECT_STORAGE_ENDPOINT: http://localhost:9000
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_ACCESS_KEY: minio
      OBJECT_STORAGE_SECRET_KEY: minio123
      ATTACHMENTS_UPLOAD_DIR: /tmp/ibp-uploads
      SMTP_ENABLED: false
      DEBUG_DATA_RESET_ENABLED: true
      CADASTRE_PROVIDER: synthetic
      CADASTRE_PROVIDER_ALLOW_FALLBACK: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: modules
        with:
          path: |
            node_modules
            api/node_modules
            mobile/node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      # A service container cannot pass `server /data`, so MinIO starts here.
      # Upstream MinIO images are no longer served (quay.io answers 401,
      # Docker Hub minio/minio is gone), so CI uses the community-maintained
      # fork pinned by digest (owner decision 2026-09-25). Test-only credentials.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minio \
            -e MINIO_ROOT_PASSWORD=minio123 \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 server /data

      - name: Wait for MinIO
        run: |
          ok=false
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live > /dev/null; then
              ok=true
              break
            fi
            sleep 2
          done

          if [ "$ok" != "true" ]; then
            echo "MinIO did not become healthy in time" >&2
            docker logs minio
            exit 1
          fi

      - name: E2E run (MinIO mode)
        run: npm run test:e2e

  mobile-build:
    name: Mobile build check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.shared == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: modules
        with:
          path: |
            node_modules
            api/node_modules
            mobile/node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      # The SDK version check compares against the live npm registry, so an Expo
      # patch release would turn every PR red. It runs below as information only.
      - name: expo-doctor
        run: npx --yes expo-doctor@1.20.4
        working-directory: mobile
        env:
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: "1"

      - name: Expo SDK version drift (informational)
        run: npx expo install --check
        working-directory: mobile
        continue-on-error: true

      - name: expo export
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/expo-export"
        working-directory: mobile

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: npm audit (all dependencies, high+)
        run: npm audit --audit-level=high

  image-check:
    name: Docker image check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.image == 'true' || needs.changes.outputs.shared == 'true'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ibp_test
          POSTGRES_USER: ibp
          POSTGRES_PASSWORD: ibp
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: api/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: cortege:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — non-root user
        run: |
          uid=$(docker run --rm --entrypoint id cortege:ci -u)
          echo "container uid: $uid"
          if [ "$uid" = "0" ]; then
            echo "image runs as root" >&2
            exit 1
          fi

      - name: Smoke test — no mobile deps in image
        run: |
          docker run --rm --entrypoint sh cortege:ci -c \
            'test ! -e node_modules/expo && test ! -e node_modules/react-native'

      - name: Smoke test — healthcheck configured
        run: |
          hc=$(docker image inspect cortege:ci --format '{{json .Config.Healthcheck}}')
          echo "$hc"
          echo "$hc" | grep -q '/v1/health'

      - name: Smoke test — container boots and answers health
        run: |
          docker run -d --name api-smoke --network host \
            -e NODE_ENV=test \
            -e PORT=3000 \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_DB=ibp_test \
            -e POSTGRES_USER=ibp \
            -e POSTGRES_PASSWORD=ibp \
            -e OBJECT_STORAGE_MODE=local \
            -e OBJECT_STORAGE_BUCKET=ibp-media \
            -e ATTACHMENTS_UPLOAD_DIR=/tmp/ibp-uploads \
            -e SMTP_ENABLED=false \
            -e DEBUG_DATA_RESET_ENABLED=true \
            -e CADASTRE_PROVIDER=synthetic \
            -e CADASTRE_PROVIDER_ALLOW_FALLBACK=true \
            cortege:ci

          ok=false
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/v1/health > /dev/null; then
              ok=true
              break
            fi
            sleep 2
          done

          if [ "$ok" != "true" ]; then
            echo "API did not become healthy in time" >&2
            docker logs api-smoke
            exit 1
          fi

      # D-05: production must refuse the dev defaults, on the image itself.
      # The CMD is overridden because the default one runs migrate.js first,
      # which would fail on the database and hide the configuration verdict.
      - name: Smoke test — production refuses default configuration
        run: |
          set +e
          timeout 60 docker run --rm \
            -e NODE_ENV=production \
            -e POSTGRES_PASSWORD=ibp \
            -e OBJECT_STORAGE_MODE=minio \
            -e OBJECT_STORAGE_SECRET_KEY=minio123 \
            cortege:ci node api/dist/main.js > refusal.log 2>&1
          code=$?
          set -e
          cat refusal.log
          if [ "$code" -eq 0 ] || [ "$code" -eq 124 ]; then
            echo "main.js should refuse production defaults (exit code $code)" >&2
            exit 1
          fi
          grep -q POSTGRES_PASSWORD refusal.log

          set +e
          timeout 60 docker run --rm \
            -e NODE_ENV=production \
            -e POSTGRES_PASSWORD=ibp \
            -e OBJECT_STORAGE_MODE=minio \
            -e OBJECT_STORAGE_SECRET_KEY=minio123 \
            cortege:ci node api/dist/config/check-config.js
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "check-config.js should exit 1 on production defaults (exit code $code)" >&2
            exit 1
          fi

          timeout 60 docker run --rm \
            -e NODE_ENV=production \
            -e POSTGRES_HOST=postgres \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=cortege \
            -e POSTGRES_DB=cortege \
            -e POSTGRES_PASSWORD=ci-smoke-db-password \
            -e OBJECT_STORAGE_MODE=minio \
            -e OBJECT_STORAGE_ENDPOINT=https://files.example.org \
            -e OBJECT_STORAGE_SECRET_KEY=ci-smoke-storage-secret \
            -e AUTH0_DOMAIN=example.eu.auth0.com \
            -e AUTH0_AUDIENCE=https://api.example.org \
            -e CORS_ORIGIN=none \
            cortege:ci node api/dist/config/check-config.js

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      [changes, check, unit-api, unit-mobile, e2e, e2e-minio, mobile-build, audit, image-check]
    steps:
      - name: Check required job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          UNIT_API_RESULT: ${{ needs.unit-api.result }}
          UNIT_MOBILE_RESULT: ${{ needs.unit-mobile.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          E2E_MINIO_RESULT: ${{ needs.e2e-minio.result }}
          MOBILE_BUILD_RESULT: ${{ needs.mobile-build.result }}
          IMAGE_CHECK_RESULT: ${{ needs.image-check.result }}
        run: |
          echo "changes: $CHANGES_RESULT"
          echo "check: $CHECK_RESULT"
          echo "audit: $AUDIT_RESULT"
          echo "unit-api: $UNIT_API_RESULT"
          echo "unit-mobile: $UNIT_MOBILE_RESULT"
          echo "e2e: $E2E_RESULT"
          echo "e2e-minio: $E2E_MINIO_RESULT"
          echo "mobile-build: $MOBILE_BUILD_RESULT"
          echo "image-check: $IMAGE_CHECK_RESULT"

          fail=false

          if [ "$CHANGES_RESULT" != "success" ]; then fail=true; fi
          if [ "$CHECK_RESULT" != "success" ]; then fail=true; fi
          if [ "$AUDIT_RESULT" != "success" ]; then fail=true; fi

          for r in "$UNIT_API_RESULT" "$UNIT_MOBILE_RESULT" "$E2E_RESULT" "$E2E_MINIO_RESULT" "$MOBILE_BUILD_RESULT" "$IMAGE_CHECK_RESULT"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              fail=true
            fi
          done

          if [ "$fail" = "true" ]; then
            echo "One or more required jobs failed or were cancelled" >&2
            exit 1
          fi

  build:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, ci-ok]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.image == 'true'
    permissions:
      contents: read
      packages: write
    concurrency:
      group: deploy-image
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: api/Dockerfile
          # The VPS is x86_64, so this builds natively on the runner.
          platforms: linux/amd64
          push: true
          # infra/vps/update-stack.sh polls the :latest tag every 5 minutes.
          tags: |
            ghcr.io/florianlepont/cortege:latest
            ghcr.io/florianlepont/cortege:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
