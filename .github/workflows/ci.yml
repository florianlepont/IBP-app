name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  test-unit-api:
    name: Unit tests — API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run unit tests
        run: npm run test:unit
        working-directory: api

  test-unit-mobile:
    name: Unit tests — Mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run unit tests
        run: npm run test:unit
        working-directory: mobile

  test-e2e-api:
    name: E2E tests — API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ibp
          POSTGRES_USER: ibp
          POSTGRES_PASSWORD: ibp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      NODE_ENV: test
      PORT: 3000
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: ibp
      POSTGRES_USER: ibp
      POSTGRES_PASSWORD: ibp
      OBJECT_STORAGE_MODE: local
      OBJECT_STORAGE_BUCKET: ibp-media
      ATTACHMENTS_UPLOAD_DIR: /tmp/ibp-uploads
      ACCESS_TOKEN_SECRET: ci-access-secret
      REFRESH_TOKEN_SECRET: ci-refresh-secret
      ACCESS_TOKEN_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      AUTH_DEV_EXPOSE_EMAIL_TOKEN: true
      AUTH_LOGIN_OR_CREATE_ENABLED: true
      SMTP_ENABLED: false
      DEBUG_DATA_RESET_ENABLED: true
      CADASTRE_PROVIDER: synthetic
      CADASTRE_PROVIDER_ALLOW_FALLBACK: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: api

  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'

  build:
    name: Build & push Docker image
    # Native arm64 runner: the deployment target is an ARM machine, and GitHub
    # provides arm64 runners free of charge to public repositories. Emulating
    # arm64 through QEMU on x86 took hours per build.
    runs-on: ubuntu-24.04-arm
    needs: [quality, test-unit-api, test-unit-mobile, test-e2e-api, changes]
    if: needs.changes.outputs.api == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./api
          platforms: linux/arm64
          push: true
          tags: ghcr.io/florianlepont/cortege:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
