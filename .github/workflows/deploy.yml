name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  # ── Deploy on Freebox VM (self-hosted runner) ─────────────────────────────
  deploy:
    name: Deploy → Freebox
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, freebox]

    steps:
      - uses: actions/checkout@v4

      - name: Build image (arm64 native)
        run: |
          docker build -t ibp-api:latest ./api

      - name: Restart API container
        run: |
          docker compose \
            -f infra/docker-compose.freebox.yml \
            --env-file "$HOME/.env.freebox" \
            up -d --no-deps --pull never api

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/v1/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "API is healthy (attempt $i)"
              exit 0
            fi
            echo "Waiting for API... (attempt $i, status: $STATUS)"
            sleep 5
          done
          echo "API did not become healthy in time"
          docker logs ibp-api --tail 50
          exit 1
