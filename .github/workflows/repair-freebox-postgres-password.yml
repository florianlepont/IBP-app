name: Repair Freebox Postgres Password

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-postgres-password:
    name: Align Postgres password with /home/freebox/.env.freebox
    runs-on: [self-hosted, freebox]
    env:
      FREEBOX_ENV_PATH: /home/freebox/.env.freebox
      FREEBOX_COMPOSE_FILE: infra/docker-compose.freebox.yml
      FREEBOX_COMPOSE_PROFILES: ${{ vars.FREEBOX_COMPOSE_PROFILES }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate env file
        run: |
          test -f "$FREEBOX_ENV_PATH"
          DB_USER="$(sed -n 's/^POSTGRES_USER=//p' "$FREEBOX_ENV_PATH" | tail -n 1 | tr -d '\r')"
          DB_PASSWORD="$(sed -n 's/^POSTGRES_PASSWORD=//p' "$FREEBOX_ENV_PATH" | tail -n 1 | tr -d '\r')"

          if [ -z "$DB_USER" ] || [ -z "$DB_PASSWORD" ]; then
            echo "POSTGRES_USER or POSTGRES_PASSWORD is missing in $FREEBOX_ENV_PATH"
            exit 1
          fi

      - name: Start postgres service
        run: |
          docker compose \
            -f "$FREEBOX_COMPOSE_FILE" \
            --env-file "$FREEBOX_ENV_PATH" \
            up -d postgres

      - name: Reset database role password
        run: |
          DB_USER="$(sed -n 's/^POSTGRES_USER=//p' "$FREEBOX_ENV_PATH" | tail -n 1 | tr -d '\r')"
          DB_PASSWORD="$(sed -n 's/^POSTGRES_PASSWORD=//p' "$FREEBOX_ENV_PATH" | tail -n 1 | tr -d '\r')"
          DB_PASSWORD_ESCAPED="$(printf "%s" "$DB_PASSWORD" | sed "s/'/''/g")"
          PGDATA_DIR="$(docker exec ibp-postgres sh -lc 'printf "%s" "$PGDATA"')"

          if [ -z "$PGDATA_DIR" ]; then
            PGDATA_DIR=/var/lib/postgresql/data
          fi

          for i in $(seq 1 30); do
            if docker exec ibp-postgres pg_isready >/dev/null 2>&1; then
              break
            fi
            echo "Waiting for postgres container... (attempt $i)"
            sleep 2
          done

          docker exec -u root ibp-postgres \
            sh -lc "cp \"$PGDATA_DIR/pg_hba.conf\" \"$PGDATA_DIR/pg_hba.conf.codex.bak\""

          cleanup() {
            docker exec -u root ibp-postgres \
              sh -lc "if [ -f \"$PGDATA_DIR/pg_hba.conf.codex.bak\" ]; then mv \"$PGDATA_DIR/pg_hba.conf.codex.bak\" \"$PGDATA_DIR/pg_hba.conf\"; fi"
            docker restart ibp-postgres >/dev/null
          }

          trap cleanup EXIT

          docker exec -u root ibp-postgres \
            sh -lc "printf 'local all all trust\nhost all all 127.0.0.1/32 trust\nhost all all ::1/128 trust\n' | cat - \"$PGDATA_DIR/pg_hba.conf\" > \"$PGDATA_DIR/pg_hba.conf.codex.tmp\" && mv \"$PGDATA_DIR/pg_hba.conf.codex.tmp\" \"$PGDATA_DIR/pg_hba.conf\""

          docker restart ibp-postgres >/dev/null

          for i in $(seq 1 30); do
            if docker exec ibp-postgres pg_isready -U "$DB_USER" >/dev/null 2>&1; then
              break
            fi
            echo "Waiting for postgres to restart with trust auth... (attempt $i)"
            sleep 2
          done

          docker exec \
            -e DB_USER="$DB_USER" \
            -e DB_PASSWORD_ESCAPED="$DB_PASSWORD_ESCAPED" \
            ibp-postgres \
            sh -lc 'psql -v ON_ERROR_STOP=1 -U "$DB_USER" -d postgres -c "ALTER ROLE \"$DB_USER\" WITH PASSWORD '\''$DB_PASSWORD_ESCAPED'\'';"'

      - name: Restart stack
        run: |
          PROFILE_ARGS=""
          if [ -n "${FREEBOX_COMPOSE_PROFILES}" ]; then
            for profile in ${FREEBOX_COMPOSE_PROFILES}; do
              PROFILE_ARGS="$PROFILE_ARGS --profile $profile"
            done
          fi

          docker compose \
            -f "$FREEBOX_COMPOSE_FILE" \
            --env-file "$FREEBOX_ENV_PATH" \
            $PROFILE_ARGS \
            up -d --remove-orphans

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/v1/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "API is healthy (attempt $i)"
              exit 0
            fi
            echo "Waiting for API... (attempt $i, status: $STATUS)"
            sleep 5
          done
          echo "API did not become healthy in time"
          docker logs ibp-api --tail 80
          exit 1
