name: Repair Freebox Postgres Password

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-postgres-password:
    name: Align Postgres password with /home/freebox/.env.freebox
    runs-on: [self-hosted, freebox]
    env:
      FREEBOX_ENV_PATH: /home/freebox/.env.freebox
      FREEBOX_COMPOSE_FILE: infra/docker-compose.freebox.yml
      FREEBOX_COMPOSE_PROFILES: ${{ vars.FREEBOX_COMPOSE_PROFILES }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate env file
        run: |
          test -f "$FREEBOX_ENV_PATH"
          DB_USER="$(sed -n 's/^POSTGRES_USER=//p' "$FREEBOX_ENV_PATH" | tail -n 1 | tr -d '\r')"
          DB_PASSWORD="$(sed -n 's/^POSTGRES_PASSWORD=//p' "$FREEBOX_ENV_PATH" | tail -n 1 | tr -d '\r')"

          if [ -z "$DB_USER" ] || [ -z "$DB_PASSWORD" ]; then
            echo "POSTGRES_USER or POSTGRES_PASSWORD is missing in $FREEBOX_ENV_PATH"
            exit 1
          fi

      - name: Start postgres service
        run: |
          docker compose \
            -f "$FREEBOX_COMPOSE_FILE" \
            --env-file "$FREEBOX_ENV_PATH" \
            up -d postgres

      - name: Reset database role password
        run: |
          DB_USER="$(sed -n 's/^POSTGRES_USER=//p' "$FREEBOX_ENV_PATH" | tail -n 1 | tr -d '\r')"
          DB_PASSWORD="$(sed -n 's/^POSTGRES_PASSWORD=//p' "$FREEBOX_ENV_PATH" | tail -n 1 | tr -d '\r')"
          DB_PASSWORD_ESCAPED="$(printf "%s" "$DB_PASSWORD" | sed "s/'/''/g")"

          for i in $(seq 1 30); do
            if docker exec ibp-postgres pg_isready >/dev/null 2>&1; then
              break
            fi
            echo "Waiting for postgres container... (attempt $i)"
            sleep 2
          done

          docker exec \
            -e DB_USER="$DB_USER" \
            -e DB_PASSWORD_ESCAPED="$DB_PASSWORD_ESCAPED" \
            -u postgres \
            ibp-postgres \
            sh -lc 'psql -v ON_ERROR_STOP=1 -d postgres -c "ALTER ROLE \"$DB_USER\" WITH PASSWORD '\''$DB_PASSWORD_ESCAPED'\'';"'

      - name: Restart stack
        run: |
          PROFILE_ARGS=""
          if [ -n "${FREEBOX_COMPOSE_PROFILES}" ]; then
            for profile in ${FREEBOX_COMPOSE_PROFILES}; do
              PROFILE_ARGS="$PROFILE_ARGS --profile $profile"
            done
          fi

          docker compose \
            -f "$FREEBOX_COMPOSE_FILE" \
            --env-file "$FREEBOX_ENV_PATH" \
            $PROFILE_ARGS \
            up -d --remove-orphans

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/v1/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "API is healthy (attempt $i)"
              exit 0
            fi
            echo "Waiting for API... (attempt $i, status: $STATUS)"
            sleep 5
          done
          echo "API did not become healthy in time"
          docker logs ibp-api --tail 80
          exit 1
