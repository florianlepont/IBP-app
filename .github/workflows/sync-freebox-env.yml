name: Sync Freebox Env

on:
  workflow_dispatch:
    inputs:
      restart_stack:
        description: Restart the Freebox Docker stack after updating the env file
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  sync-env:
    name: Sync /home/freebox/.env.freebox
    runs-on: [self-hosted, freebox]
    env:
      FREEBOX_ENV_PATH: /home/freebox/.env.freebox
      FREEBOX_COMPOSE_FILE: infra/docker-compose.freebox.yml
      FREEBOX_COMPOSE_PROFILES: ${{ vars.FREEBOX_COMPOSE_PROFILES }}
      FREEBOX_ENV_FILE_CONTENT: ${{ secrets.FREEBOX_ENV_FILE_CONTENT }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate env secret
        run: |
          if [ -z "${FREEBOX_ENV_FILE_CONTENT}" ]; then
            echo "Missing repository secret FREEBOX_ENV_FILE_CONTENT"
            exit 1
          fi

      - name: Write remote env file
        run: |
          install -d "$(dirname "$FREEBOX_ENV_PATH")"
          umask 077
          printf '%s\n' "$FREEBOX_ENV_FILE_CONTENT" > "$FREEBOX_ENV_PATH"
          echo "Wrote $FREEBOX_ENV_PATH"

      - name: Restart stack
        if: ${{ inputs.restart_stack }}
        run: |
          PROFILE_ARGS=""
          if [ -n "${FREEBOX_COMPOSE_PROFILES}" ]; then
            for profile in ${FREEBOX_COMPOSE_PROFILES}; do
              PROFILE_ARGS="$PROFILE_ARGS --profile $profile"
            done
          fi

          docker compose \
            -f "$FREEBOX_COMPOSE_FILE" \
            --env-file "$FREEBOX_ENV_PATH" \
            $PROFILE_ARGS \
            up -d --remove-orphans

      - name: Health check
        if: ${{ inputs.restart_stack }}
        run: |
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/v1/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "API is healthy (attempt $i)"
              exit 0
            fi
            echo "Waiting for API... (attempt $i, status: $STATUS)"
            sleep 5
          done
          echo "API did not become healthy in time"
          docker logs ibp-api --tail 80
          exit 1
