services:
  postgres:
    image: postgres:16
    container_name: ibp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ibp
      POSTGRES_USER: ibp
      POSTGRES_PASSWORD: ibp
    ports:
      - "5432:5432"
    volumes:
      - ibp_postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: ibp-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ibp_minio_data:/data

  # Option 1 (défaut) : URL temporaire trycloudflare.com, sans compte
  # Lance avec : docker compose -f docker-compose.mac-tunnel.yml up -d cloudflared-temp
  cloudflared-temp:
    image: cloudflare/cloudflared:latest
    container_name: ibp-tunnel-temp
    restart: unless-stopped
    network_mode: host
    command: tunnel --url http://localhost:3000

  # Option 2 : URL fixe avec ton domaine Cloudflare (nécessite CLOUDFLARE_TUNNEL_TOKEN)
  # Lance avec : CLOUDFLARE_TUNNEL_TOKEN=xxx docker compose -f docker-compose.mac-tunnel.yml up -d cloudflared
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ibp-tunnel
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  ibp_postgres_data:
  ibp_minio_data:
