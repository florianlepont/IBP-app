services:
  postgres:
    image: postgres:16
    container_name: ibp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ibp
      POSTGRES_USER: ibp
      POSTGRES_PASSWORD: ibp
    ports:
      - "5432:5432"
    volumes:
      - ibp_postgres_data:/var/lib/postgresql/data

  minio:
    # Upstream MinIO images are no longer served (quay.io answers 401, Docker Hub
    # minio/minio is gone): same maintained fork as CI, pinned by digest.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    container_name: ibp-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ibp_minio_data:/data

volumes:
  ibp_postgres_data:
  ibp_minio_data:
